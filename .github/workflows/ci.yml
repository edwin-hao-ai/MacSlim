name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust 编译 + 单元测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets --verbose

      - name: 发布脚本语法
        run: bash -n scripts/publish-update.sh scripts/release.sh scripts/sign.sh

      - name: Entitlements 语法
        run: plutil -lint src-tauri/entitlements.plist

  test-frontend:
    name: 前端类型检查 + 构建
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: bun install
        run: bun install --frozen-lockfile

      - name: 前端与安全配置验证（无 Rust）
        run: bun run verify:frontend

  build-release:
    name: Release 构建（ARM64）
    runs-on: macos-latest
    needs: [test-rust, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Release 打包（无签名）
        run: bun run tauri build --target aarch64-apple-darwin --no-sign

      - name: 上传 DMG 产物
        uses: actions/upload-artifact@v4
        with:
          name: macslim-arm64-unsigned
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
