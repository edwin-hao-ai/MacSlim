[package]
name = "macslim"
version = "1.0.0"
description = "MacSlim - Mac developer and user system maintenance tool"
authors = ["Edwin Hao"]
edition = "2021"
rust-version = "1.80"
default-run = "macslim"

[lib]
name = "macslim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ===== 构建形态 =====
#
# 默认（不写 `--features mas`）= Developer ID / 公证全功能版。
# `mas` = Mac App Store 版，走 App Sandbox，可用能力更少。
#
# 目前 `mas` 唯一的行为差异是**拒绝终止进程**
# （`lib.rs` 里 `#[cfg(feature = "mas")]` 那道守卫）：App Sandbox 下沙箱进程
# 不能给其他进程发信号，且没有任何 entitlement 能放行。其余能力
# （Docker 探测等）在沙箱下会自然降级 —— 见 docs/dual-release-decision.md。
[features]
default = []
mas = []

[[bin]]
name = "macslim"
path = "src/main.rs"

[[bin]]
name = "macslim-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-os = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-autostart = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-process = "2.2"
# 打开「完全磁盘访问权限」设置页（FDA 授权向导用）。
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
# 原生解析 Info.plist，替代 shell 出去的 `plutil -convert xml1`。
# App Sandbox 下沙箱进程只能 exec 自己 bundle 里的二进制，`plutil` 不可用，
# 所以这一条是 MAS 构建能否跑起来的前提，不是可选优化。
plist = "1.7"
serde_json = "1"
getrandom = "0.2"
sysinfo = "0.33"
nix = { version = "0.29", features = ["signal", "process", "user"] }
# 直接调 `sysctl(KERN_PROC_ALL)` 枚举进程。nix 0.29 没有暴露 sysctl 模块，
# 而 sysinfo 在 MAS 构建下走 `apple-sandbox` 分支、那个分支是返回全 0 的桩，
# 不能拿它当「沙箱读不到进程」的证据。libc 本来就已被传递依赖引入。
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rayon = "1"
which = "7"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
